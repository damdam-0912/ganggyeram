<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf6e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="강계람" />
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=9" />
  <link rel="manifest" href="manifest.webmanifest?v=9" />
  <link rel="stylesheet" href="styles.css?v=9" />
  <title>강계람</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">PROMPT ALBUM</div>
        <h1>강계람</h1>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" aria-label="테마">☾</button>
        <button id="settingsBtn" class="icon-btn" aria-label="백업 및 설정">⚙</button>
      </div>
    </header>

    <section class="search-wrap">
      <input id="searchInput" type="search" placeholder="제목, 프롬프트, 태그 검색" autocomplete="off" />
      <button id="clearSearchBtn" class="clear-search" aria-label="검색 지우기">×</button>
    </section>

    <nav class="filter-tabs" id="filterTabs">
      <button class="chip active" data-filter="all">전체</button>
      <button class="chip" data-filter="favorite">★ 즐겨찾기</button>
      <button class="chip" data-filter="trash">휴지통</button>
    </nav>

    <section class="layout">
      <aside class="folders card-panel">
        <div class="section-head">
          <h2>폴더</h2>
          <button id="addFolderBtn" class="mini-btn">+ 폴더</button>
        </div>
        <div id="folderTree" class="folder-tree"></div>
      </aside>

      <main class="content">
        <div class="section-head sticky-head">
          <div>
            <div id="currentFolderLabel" class="muted">전체 프롬프트</div>
            <strong id="entryCount">0개</strong>
          </div>
          <div class="head-actions">
            <button id="generatorBtn" class="secondary-btn">생성기</button>
            <button id="addEntryBtn" class="primary-btn">+ 새 프롬프트</button>
          </div>
        </div>
        <div id="tagCloud" class="tag-cloud"></div>
        <div id="entryGrid" class="entry-grid"></div>
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon">✦</div>
          <h3>아직 저장된 프롬프트가 없어요</h3>
          <p>이미지와 프롬프트를 한곳에 모아보세요.</p>
        </div>
      </main>
    </section>
  </div>

  <button id="fab" class="fab" aria-label="새 프롬프트">＋</button>

  <dialog id="entryDialog" class="sheet-dialog">
    <form id="entryForm" method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="entryDialogTitle">새 프롬프트</h2>
        <button type="button" class="icon-btn close-dialog">×</button>
      </div>
      <input type="hidden" id="entryId" />
      <label>제목<input id="entryTitle" required maxlength="120" placeholder="예: 봄 교실 / 행복한 표정" /></label>
      <div class="two-col">
        <label>종류<select id="entryType"><option>NovelAI</option><option>Stable Diffusion</option><option>Midjourney</option><option>영상</option><option>기타</option></select></label>
        <label>폴더<select id="entryFolder"></select></label>
      </div>
      <label>프롬프트<textarea id="entryPrompt" rows="8" placeholder="프롬프트를 입력하세요"></textarea></label>
      <label>캐릭터 1<textarea id="entryCharacter1" rows="6" placeholder="캐릭터 1 프롬프트"></textarea></label>
      <label id="character2Label">캐릭터 2<textarea id="entryCharacter2" rows="6" placeholder="캐릭터 2 프롬프트"></textarea></label>
      <label>네거티브 / 메모<textarea id="entryNegative" rows="4" placeholder="네거티브 프롬프트나 메모"></textarea></label>
      <label>태그<input id="entryTags" placeholder="쉼표로 구분: 남캐, 교복, 봄" /></label>
      <label class="image-picker-label">이미지
        <input id="entryImages" type="file" accept="image/*" multiple />
        <span class="file-btn">사진 선택</span>
      </label>
      <div id="imagePreview" class="image-preview"></div>
      <div id="naiMetaBox" class="nai-meta-box hidden">
        <div class="nai-meta-head"><strong>NovelAI 생성 정보</strong><span id="naiMetaStatus">메타데이터 감지됨</span></div>
        <div class="nai-meta-grid">
          <label>Seed<input id="entrySeed" readonly /></label>
          <label>Steps<input id="entrySteps" readonly /></label>
          <label>Scale<input id="entryScale" readonly /></label>
          <label>Sampler<input id="entrySampler" readonly /></label>
          <label class="nai-meta-wide">Model<input id="entryModel" readonly /></label>
        </div>
      </div>
      <label class="toggle-row"><input id="entryFavorite" type="checkbox" /><span>즐겨찾기</span></label>
      <div class="sheet-actions">
        <button type="button" class="secondary-btn close-dialog">취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="folderDialog" class="sheet-dialog small-dialog">
    <form id="folderForm" method="dialog" class="sheet">
      <div class="sheet-head"><h2 id="folderDialogTitle">폴더 추가</h2><button type="button" class="icon-btn close-dialog">×</button></div>
      <input type="hidden" id="folderId" />
      <label>폴더 이름<input id="folderName" required maxlength="60" /></label>
      <label>상위 폴더<select id="folderParent"></select></label>
      <div class="sheet-actions"><button type="button" class="secondary-btn close-dialog">취소</button><button class="primary-btn" type="submit">저장</button></div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="detail-dialog">
    <article class="detail-card">
      <button class="icon-btn close-dialog detail-close">×</button>
      <div id="detailBody"></div>
    </article>
  </dialog>

  <dialog id="generatorDialog" class="sheet-dialog">
    <form id="generatorForm" method="dialog" class="sheet">
      <div class="sheet-head"><h2>프롬프트 생성기</h2><button type="button" class="icon-btn close-dialog">×</button></div>
      <p class="muted">블록을 줄 단위로 적고 원하는 것만 체크해서 합칠 수 있어요.</p>
      <div id="generatorBlocks" class="generator-blocks"></div>
      <button type="button" id="addGeneratorBlock" class="secondary-btn full">+ 블록 추가</button>
      <label>결과<textarea id="generatorResult" rows="7" readonly></textarea></label>
      <div class="sheet-actions"><button type="button" id="copyGeneratorBtn" class="secondary-btn">복사</button><button type="button" id="saveGeneratedBtn" class="primary-btn">앨범에 저장</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="sheet-dialog small-dialog">
    <section class="sheet">
      <div class="sheet-head"><h2>백업 및 설정</h2><button type="button" class="icon-btn close-dialog">×</button></div>
      <div class="settings-list">
        <button id="exportBtn" class="settings-row"><span>JSON 백업 내보내기</span><b>›</b></button>
        <label class="settings-row file-row"><span>JSON 백업 불러오기</span><b>›</b><input id="importInput" type="file" accept="application/json,.json" /></label>
        <button id="seedBtn" class="settings-row"><span>예시 데이터 추가</span><b>›</b></button>
        <button id="clearAllBtn" class="settings-row danger"><span>모든 데이터 삭제</span><b>›</b></button>
      </div>
      <div class="install-tip"><strong>iPhone 설치</strong><br>Safari 공유 버튼 → <b>홈 화면에 추가</b></div>
    </section>
  </dialog>

  <template id="generatorBlockTpl">
    <div class="generator-block">
      <input type="checkbox" checked />
      <input type="text" placeholder="예: boy, solo, male focus" />
      <button type="button" class="remove-block">×</button>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
